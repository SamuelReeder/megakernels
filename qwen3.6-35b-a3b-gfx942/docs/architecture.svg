<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0b0b0b">Qwen3.6-35B-A3B: one launch per decode step, 304 persistent CTAs (one per MI300X CU)</text>
  <text x="30" y="64" font-size="14" fill="#52514e">241 stages per step (40 layers × 6 + LM head), separated by grid barriers. 1 to 8 rows. FP8 weights (the FP8 checkpoint, repacked).</text>

  <!-- per-layer stage strip -->
  <g font-size="12" text-anchor="middle" fill="#0b0b0b">
    <text x="30" y="104" font-size="13" font-weight="700" text-anchor="start" fill="#52514e">ONE LAYER, SPLIT ACROSS ALL 304 CUs (30 Gated DeltaNet layers, 10 gated attention layers: every 4th)</text>
    <rect x="30" y="116" width="150" height="48" rx="6" fill="#2a78d6"/><text x="105" y="136" fill="#fff" font-weight="700">S1 in_proj / qkv</text><text x="105" y="153" fill="#fff" font-size="11">RMSNorm + FP8 GEMV</text>
    <rect x="190" y="116" width="150" height="48" rx="6" fill="#eb6834"/><text x="265" y="136" fill="#fff" font-weight="700">S2 mixer</text><text x="265" y="153" fill="#fff" font-size="11">delta rule / attention</text>
    <rect x="350" y="116" width="150" height="48" rx="6" fill="#1baf7a"/><text x="425" y="136" fill="#fff" font-weight="700">S3 out / o_proj</text><text x="425" y="153" fill="#fff" font-size="11">GEMV + residual</text>
    <rect x="510" y="116" width="130" height="48" rx="6" fill="#6b6a64"/><text x="575" y="136" fill="#fff" font-weight="700">S4 router</text><text x="575" y="153" fill="#fff" font-size="11">bf16 GEMV, 257 logits</text>
    <rect x="650" y="116" width="170" height="48" rx="6" fill="#eda100"/><text x="735" y="136" fill="#fff" font-weight="700">S5 routing + gate_up</text><text x="735" y="153" fill="#fff" font-size="11">top-8, grouped GEMV, SiLU-mul</text>
    <rect x="830" y="116" width="150" height="48" rx="6" fill="#e87fa3"/><text x="905" y="136" fill="#fff" font-weight="700">S6 experts down</text><text x="905" y="153" fill="#fff" font-size="11">weighted sum + residual</text>
    <text x="1010" y="146" font-size="18" fill="#52514e">× 40</text>
    <rect x="1050" y="116" width="120" height="48" rx="6" fill="#0b7d32"/><text x="1110" y="136" fill="#fff" font-weight="700">LM head</text><text x="1110" y="153" fill="#fff" font-size="11">248K-vocab bf16</text>
  </g>
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#a)">
    <line x1="180" y1="140" x2="188" y2="140"/><line x1="340" y1="140" x2="348" y2="140"/>
    <line x1="500" y1="140" x2="508" y2="140"/><line x1="640" y1="140" x2="648" y2="140"/>
    <line x1="820" y1="140" x2="828" y2="140"/><line x1="980" y1="140" x2="1000" y2="140"/>
    <line x1="1035" y1="140" x2="1048" y2="140"/>
  </g>
  <text x="30" y="190" font-size="12" fill="#52514e">Each arrow is a grid barrier (two levels: one leader per XCD; 2 to 4 µs with the store drain). A GEMV's weight tiles are divided among all 2,432 waves.</text>

  <!-- MoE block -->
  <text x="30" y="232" font-size="13" font-weight="700" fill="#52514e">THE MoE BLOCK (S4 to S6): EVERY SELECTED EXPERT IS READ ONCE, BY ALL CUs</text>
  <rect x="30" y="246" width="330" height="200" rx="8" fill="#f2f1ec" stroke="#e1e0d9"/>
  <text x="45" y="270" font-size="13" font-weight="700" fill="#0b0b0b">1. Routing, in every CTA</text>
  <text x="45" y="292" font-size="12" fill="#52514e">wave m: row m's 256 fp32 logits, top-8 by</text>
  <text x="45" y="308" font-size="12" fill="#52514e">8 rounds of a DPP wave max (ties: lower id),</text>
  <text x="45" y="324" font-size="12" fill="#52514e">softmax weights, sigmoid shared gate</text>
  <text x="45" y="346" font-size="12" fill="#52514e">wave 0: OR of the rows' 256-bit expert sets</text>
  <text x="45" y="362" font-size="12" fill="#52514e">→ positions: U unique experts + the shared one</text>
  <text x="45" y="378" font-size="12" fill="#52514e">→ slot_of[row][position] (or -1)</text>
  <text x="45" y="400" font-size="12" fill="#52514e">Tables stay in LDS for S5 and S6; a debug</text>
  <text x="45" y="416" font-size="12" fill="#52514e">hash checks that all 304 CTAs agree.</text>
  <text x="45" y="436" font-size="12" fill="#52514e">Padding rows select no expert.</text>

  <rect x="380" y="246" width="380" height="200" rx="8" fill="#f2f1ec" stroke="#e1e0d9"/>
  <text x="395" y="270" font-size="13" font-weight="700" fill="#0b0b0b">2. Grouped GEMV over the U + 1 positions</text>
  <g font-size="11" fill="#fff" text-anchor="middle">
    <rect x="395" y="284" width="56" height="26" rx="4" fill="#eda100"/><text x="423" y="301">e 3</text>
    <rect x="455" y="284" width="56" height="26" rx="4" fill="#eda100"/><text x="483" y="301">e 17</text>
    <rect x="515" y="284" width="56" height="26" rx="4" fill="#eda100"/><text x="543" y="301">e 42</text>
    <rect x="575" y="284" width="56" height="26" rx="4" fill="#eda100"/><text x="603" y="301">…</text>
    <rect x="635" y="284" width="56" height="26" rx="4" fill="#eda100"/><text x="663" y="301">e 250</text>
    <rect x="695" y="284" width="56" height="26" rx="4" fill="#b37a00"/><text x="723" y="301">shared</text>
  </g>
  <text x="395" y="332" font-size="12" fill="#52514e">Pieces (position, K chunk, 16-row group) in a fixed order;</text>
  <text x="395" y="348" font-size="12" fill="#52514e">wave gw takes pieces [gw T / NW, (gw+1) T / NW) whole,</text>
  <text x="395" y="364" font-size="12" fill="#52514e">so a piece's sum never depends on T (batch invariance).</text>
  <text x="395" y="386" font-size="12" fill="#52514e">All rows go through each MFMA; a row that did not pick</text>
  <text x="395" y="402" font-size="12" fill="#52514e">the expert is dropped in the epilogue.</text>
  <text x="395" y="424" font-size="12" fill="#52514e">M = 1: 9 experts × 3 MB; M = 8: up to 65 positions.</text>

  <rect x="780" y="246" width="390" height="200" rx="8" fill="#f2f1ec" stroke="#e1e0d9"/>
  <text x="795" y="270" font-size="13" font-weight="700" fill="#0b0b0b">3. Fixed-order reduction, no float atomics</text>
  <text x="795" y="292" font-size="12" fill="#52514e">S5: counter per (position, group) counts the K chunks;</text>
  <text x="795" y="308" font-size="12" fill="#52514e">the last arriver sums them in order, stores</text>
  <text x="795" y="324" font-size="12" fill="#52514e">act = silu(gate) · up for each row that uses it.</text>
  <text x="795" y="346" font-size="12" fill="#52514e">S6: each piece stores per-(row, slot) partials;</text>
  <text x="795" y="362" font-size="12" fill="#52514e">two-level counters (4 sub-counters per group) find</text>
  <text x="795" y="378" font-size="12" fill="#52514e">the last arriver, which forms Σ_j w[m][j] · partial_j</text>
  <text x="795" y="394" font-size="12" fill="#52514e">in slot order and adds the residual.</text>
  <text x="795" y="416" font-size="12" fill="#52514e">Same bits alone or in any batch (tested at M = 1..8,</text>
  <text x="795" y="432" font-size="12" fill="#52514e">with padding rows).</text>

  <!-- FP8 unit -->
  <text x="30" y="490" font-size="13" font-weight="700" fill="#52514e">THE FP8 WEIGHT STREAM INSIDE ONE CU</text>
  <rect x="30" y="504" width="250" height="110" rx="8" fill="#eaf2fb" stroke="#2a78d6"/>
  <text x="45" y="528" font-size="13" font-weight="700" fill="#0b0b0b">unit = 16 rows × 128 K</text>
  <text x="45" y="550" font-size="12" fill="#52514e">2 KiB e4m3fnuz tile (checkpoint</text>
  <text x="45" y="566" font-size="12" fill="#52514e">e4m3fn bits, 0x80 → 0, scale × 2)</text>
  <text x="45" y="582" font-size="12" fill="#52514e">+ 2 fp32 block scales (rows 0-7, 8-15),</text>
  <text x="45" y="598" font-size="12" fill="#52514e">packed in the order the waves read them</text>
  <rect x="320" y="504" width="250" height="110" rx="8" fill="#fdf1e9" stroke="#eb6834"/>
  <text x="335" y="528" font-size="13" font-weight="700" fill="#0b0b0b">activations in LDS</text>
  <text x="335" y="550" font-size="12" fill="#52514e">the stage prologue (RMSNorm, attention</text>
  <text x="335" y="566" font-size="12" fill="#52514e">merge or SiLU-mul) quantizes x to fp8</text>
  <text x="335" y="582" font-size="12" fill="#52514e">with a power-of-two scale per</text>
  <text x="335" y="598" font-size="12" fill="#52514e">(row, 128 K)</text>
  <rect x="610" y="504" width="270" height="110" rx="8" fill="#e8f7f1" stroke="#1baf7a"/>
  <text x="625" y="528" font-size="13" font-weight="700" fill="#0b0b0b">v_mfma_f32_16x16x32_fp8_fp8</text>
  <text x="625" y="550" font-size="12" fill="#52514e">4 MFMAs per unit, rows of the batch as</text>
  <text x="625" y="566" font-size="12" fill="#52514e">the A operand (M ≤ 8 of 16), fp32 result</text>
  <text x="625" y="582" font-size="12" fill="#52514e">× weight scale × activation scale</text>
  <text x="625" y="598" font-size="12" fill="#52514e">→ per-wave partial sums</text>
  <rect x="920" y="504" width="250" height="110" rx="8" fill="#f2f1ec" stroke="#6b6a64"/>
  <text x="935" y="528" font-size="13" font-weight="700" fill="#0b0b0b">split-K hand-off</text>
  <text x="935" y="550" font-size="12" fill="#52514e">partials stored device-scope (sc1),</text>
  <text x="935" y="566" font-size="12" fill="#52514e">drained, then a device atomic; the last</text>
  <text x="935" y="582" font-size="12" fill="#52514e">arriver of a group sums them in a fixed</text>
  <text x="935" y="598" font-size="12" fill="#52514e">order and runs the epilogue</text>
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#a)">
    <line x1="280" y1="559" x2="318" y2="559"/><line x1="570" y1="559" x2="608" y2="559"/>
    <line x1="880" y1="559" x2="918" y2="559"/>
  </g>

  <text x="30" y="654" font-size="13" font-weight="700" fill="#52514e">CACHES</text>
  <text x="30" y="676" font-size="12" fill="#52514e">KV cache: bf16 paged blocks in vLLM's TRITON_ATTN or ROCM_ATTN (x-packed) layout; attention runs as (row, KV head, 64-position chunk) wave tasks whose</text>
  <text x="30" y="692" font-size="12" fill="#52514e">partial softmax records the o_proj prologue merges per head. GDN: bf16 conv state and fp32 [V][K] SSM state per vLLM slot, updated in place.</text>
  <text x="30" y="724" font-size="12" fill="#898781">Design record, numerics, invariants and the measured optimization log: docs/DESIGN.md.</text>
</svg>
