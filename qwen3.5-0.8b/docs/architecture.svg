<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#52514e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#eb6834"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#fcfcfb"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0b0b0b">One launch decodes up to 256 tokens: 84 persistent CTAs, one per SM</text>
  <text x="30" y="64" font-size="14" fill="#52514e">Every CTA runs the same program: 121 ops per token (24 layers × 5 ops + LM head). No kernel boundaries, no grid barriers.</text>

  <!-- per-token op strip -->
  <g font-size="12" text-anchor="middle" fill="#0b0b0b">
    <text x="30" y="106" font-size="13" font-weight="700" text-anchor="start" fill="#52514e">ONE LAYER, SPLIT ACROSS ALL SMs</text>
    <rect x="30" y="118" width="170" height="44" rx="6" fill="#2a78d6"/><text x="115" y="138" fill="#fff" font-weight="700">in_proj</text><text x="115" y="154" fill="#fff" font-size="11">norm + projections</text>
    <rect x="212" y="118" width="190" height="44" rx="6" fill="#eb6834"/><text x="307" y="138" fill="#fff" font-weight="700">mixer</text><text x="307" y="154" fill="#fff" font-size="11">DeltaNet or attention</text>
    <rect x="414" y="118" width="150" height="44" rx="6" fill="#1baf7a"/><text x="489" y="138" fill="#fff" font-weight="700">out_proj</text><text x="489" y="154" fill="#fff" font-size="11">GEMV + residual</text>
    <rect x="576" y="118" width="170" height="44" rx="6" fill="#eda100"/><text x="661" y="138" fill="#0b0b0b" font-weight="700">mlp gate/up</text><text x="661" y="154" fill="#0b0b0b" font-size="11">norm, GEMVs, SiLU·mul</text>
    <rect x="758" y="118" width="150" height="44" rx="6" fill="#e87ba4"/><text x="833" y="138" fill="#0b0b0b" font-weight="700">mlp down</text><text x="833" y="154" fill="#0b0b0b" font-size="11">GEMV + residual</text>
    <text x="945" y="145" font-size="20" fill="#52514e" text-anchor="start">× 24</text>
    <rect x="1010" y="118" width="160" height="44" rx="6" fill="#008300"/><text x="1090" y="138" fill="#fff" font-weight="700">LM head</text><text x="1090" y="154" fill="#fff" font-size="11">248K-vocab GEMV, argmax</text>
  </g>
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#a)">
    <line x1="200" y1="140" x2="210" y2="140"/><line x1="402" y1="140" x2="412" y2="140"/>
    <line x1="564" y1="140" x2="574" y2="140"/><line x1="746" y1="140" x2="756" y2="140"/>
    <line x1="908" y1="140" x2="938" y2="140"/><line x1="978" y1="140" x2="1008" y2="140"/>
  </g>
  <text x="30" y="188" font-size="12" fill="#52514e">Weight rows of each op are divided among the 84 CTAs, so every SM streams a slice of every op. The sampled token is fed back to the embedding lookup inside the kernel.</text>

  <!-- inside one SM -->
  <text x="30" y="236" font-size="13" font-weight="700" fill="#52514e">INSIDE ONE SM: STREAM WEIGHTS, NEVER WAIT FOR THEM</text>
  <rect x="30" y="252" width="130" height="150" rx="8" fill="#e1e0d9"/>
  <text x="95" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0b0b">GDDR7</text>
  <text x="95" y="320" font-size="12" text-anchor="middle" fill="#52514e">weights</text>
  <text x="95" y="338" font-size="12" text-anchor="middle" fill="#52514e">bf16 or int8</text>
  <text x="95" y="360" font-size="11" text-anchor="middle" fill="#52514e">read once</text>
  <text x="95" y="376" font-size="11" text-anchor="middle" fill="#52514e">per token</text>

  <rect x="210" y="252" width="120" height="68" rx="8" fill="#fff" stroke="#c3c2b7"/>
  <text x="270" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">L2 (64 MB)</text>
  <text x="270" y="296" font-size="11" text-anchor="middle" fill="#52514e">prefetch cursor runs</text>
  <text x="270" y="310" font-size="11" text-anchor="middle" fill="#52514e">32 KB ahead per SM</text>

  <rect x="380" y="246" width="800" height="236" rx="10" fill="#fff" stroke="#c3c2b7" stroke-dasharray="5 4"/>
  <text x="394" y="474" font-size="12" font-weight="700" fill="#898781">one CTA: 544 threads = 1 producer warp + 16 consumer warps</text>

  <rect x="400" y="282" width="150" height="60" rx="8" fill="#2a78d6"/>
  <text x="475" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">producer warp</text>
  <text x="475" y="326" font-size="11" text-anchor="middle" fill="#fff">cp.async.bulk (TMA)</text>

  <g font-size="11" text-anchor="middle" fill="#0b0b0b">
    <text x="745" y="278" font-size="12" fill="#52514e" font-weight="700">shared-memory ring: 5 stages × 15,232 B</text>
    <rect x="590" y="288" width="110" height="48" rx="6" fill="#d4e4f7" stroke="#2a78d6"/><text x="645" y="316">stage 0</text>
    <rect x="708" y="288" width="110" height="48" rx="6" fill="#d4e4f7" stroke="#2a78d6"/><text x="763" y="316">stage 1</text>
    <rect x="826" y="288" width="110" height="48" rx="6" fill="#d4e4f7" stroke="#2a78d6"/><text x="881" y="316">stage 2</text>
    <rect x="944" y="288" width="110" height="48" rx="6" fill="#d4e4f7" stroke="#2a78d6"/><text x="999" y="316">stage 3</text>
    <rect x="1062" y="288" width="110" height="48" rx="6" fill="#d4e4f7" stroke="#2a78d6"/><text x="1117" y="316">stage 4</text>
  </g>
  <text x="880" y="356" font-size="11" text-anchor="middle" fill="#52514e">each stage has a "full" mbarrier (TMA bytes landed) and an "empty" mbarrier (consumers done)</text>

  <rect x="590" y="376" width="582" height="86" rx="8" fill="#1baf7a"/>
  <text x="881" y="400" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">16 consumer warps</text>
  <text x="881" y="420" font-size="11.5" text-anchor="middle" fill="#fff">each warp dots whole weight rows with the activation vector (fp32 accumulate;</text>
  <text x="881" y="436" font-size="11.5" text-anchor="middle" fill="#fff">int8 is dequantized with a PRMT trick), then the CTA reduces in a fixed order,</text>
  <text x="881" y="454" font-size="11.5" text-anchor="middle" fill="#fff">so results are bitwise reproducible, and publishes its slice as flagged words</text>

  <g stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M160 300 L208 290"/>
    <path d="M330 290 L398 300"/>
    <path d="M550 312 L588 312"/>
    <path d="M1000 336 L1000 374"/>
  </g>
  <path d="M160 360 C260 440 340 440 400 330" stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="250" y="446" font-size="11" fill="#52514e">TMA bulk copy, evict_first so</text>
  <text x="250" y="460" font-size="11" fill="#52514e">streamed weights don't flush L2</text>

  <!-- cross-SM dataflow -->
  <text x="30" y="528" font-size="13" font-weight="700" fill="#52514e">BETWEEN SMs: THE FLAG LIVES IN THE DATA</text>
  <g font-size="12">
    <rect x="30" y="544" width="300" height="120" rx="8" fill="#fff" stroke="#c3c2b7"/>
    <text x="46" y="568" font-weight="700" fill="#0b0b0b">op i, on every SM</text>
    <text x="46" y="590" fill="#52514e">writes its output slice to global memory as</text>
    <text x="46" y="612" font-family="monospace" font-size="13" fill="#0b0b0b">u64 = (epoch &lt;&lt; 32) | fp32 bits</text>
    <text x="46" y="634" fill="#52514e">with st.relaxed.gpu: value and flag land</text>
    <text x="46" y="650" fill="#52514e">in one 8-byte store, nothing to fence</text>

    <rect x="470" y="544" width="330" height="120" rx="8" fill="#fff" stroke="#c3c2b7"/>
    <text x="486" y="568" font-weight="700" fill="#0b0b0b">op i+1, on every SM</text>
    <text x="486" y="590" fill="#52514e">polls only the elements it needs with</text>
    <text x="486" y="612" font-family="monospace" font-size="13" fill="#0b0b0b">ld.relaxed.gpu until epoch matches</text>
    <text x="486" y="634" fill="#52514e">then starts at once. Its weights are already</text>
    <text x="486" y="650" fill="#52514e">in the ring because the producer ran ahead.</text>

    <rect x="940" y="544" width="230" height="120" rx="8" fill="#fbeee8" stroke="#eb6834"/>
    <text x="956" y="568" font-weight="700" fill="#0b0b0b">What this removes</text>
    <text x="956" y="590" fill="#52514e">121 grid barriers per token,</text>
    <text x="956" y="610" fill="#52514e">each 3-5 µs under load.</text>
    <text x="956" y="636" fill="#0b0b0b" font-weight="700">Waiting is per element,</text>
    <text x="956" y="652" fill="#0b0b0b" font-weight="700">not per grid.</text>
  </g>
  <g stroke="#eb6834" stroke-width="2" marker-end="url(#b)">
    <line x1="330" y1="604" x2="468" y2="604"/>
  </g>
  <text x="400" y="596" font-size="11" fill="#eb6834" text-anchor="middle">flagged words</text>
  <path d="M634 664 C634 690 400 690 400 664" stroke="none" fill="none"/>
</svg>
